<!doctype html>
<html lang="ru" data-theme="cream" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Чат с Амалией, бухгалтером-консультантом сервиса САЛЬДО: расходы, первичные документы и учёт входящего НДС."
    />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>чат с Амалией</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <script>
      // Palette and brightness are pinned to the scheme of the main site while
      // the picker is hidden (see client/src/lib/theme.ts). Still inline and
      // before first paint, so nothing flashes; when the picker comes back,
      // restore the localStorage lookup and the prefers-color-scheme fallback
      // here, and set the meta tag above back to "light dark".
      (function () {
        document.documentElement.dataset.theme = 'cream';
        document.documentElement.dataset.mode = 'light';
        document.documentElement.style.colorScheme = 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
